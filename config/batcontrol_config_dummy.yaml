#--------------------------
#  batcontrol - every parameter, short comments. See README.md for the rules.
#  Keys of older versions (pvinstallations, consumption_forecast, ...) are
#  accepted and ignored.
#--------------------------
timezone: Europe/Berlin # required
loglevel: info # debug | info | warning | error
logfile_enabled: true
log_everything: false # true also logs fronius.auth and urllib3 debug output
max_logfile_size: 200 # kB
logfile_path: logs/batcontrol.log

battery_control:
  min_price_difference: 0.05 # EUR/kWh a night slot must be cheaper than the later expensive hour. Default: 0.05
  min_recharge_amount: 500 # Wh, smallest reserve gap worth a grid charge. Default: 500

inverter:
  type: fronius_gen24 # the only supported inverter (Fronius GEN24 Solar API)
  address: 192.168.0.10 # IP or hostname
  user: customer
  password: YOUR-PASSWORD
  max_grid_charge_rate: 3800 # W, full speed for every grid charge
  # capacity: 10000 # Wh, override when the inverter reports a wrong capacity
  # fronius_inverter_id: 1
  # fronius_controller_id: 0
  # outage_tolerance_minutes: 24 # exit after the inverter is unreachable this long

utility:
  type: tibber # the only supported tariff, 15-minute prices
  api_token: YOUR-TIBBER-TOKEN

api:
  enabled: true # web dashboard and REST API
  host: 0.0.0.0 # 127.0.0.1 = this machine only
  port: 8080
  # auth_token: "" # bearer token; also protects the manual charge button
  # docs_enabled: false # Swagger UI at /docs
