services:
  batcontrol:
    image: 192.168.178.63:32768/batcontrol:latest
    build: .
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Named volumes, managed by Docker: a recreated container keeps them.
      # config holds batcontrol_config.yaml and the inverter backup restored
      # on shutdown.
      - config:/app/config
      - logs:/app/logs
    # Must match api.port in the config.
    ports:
      - "2187:2187"
    # Give batcontrol time to restore the inverter settings on shutdown.
    stop_grace_period: 30s
    restart: unless-stopped

volumes:
  config:
  logs:
