services:
  batcontrol:
    image: 192.168.178.63:32768/batcontrol:latest
    build: .
    environment:
      - TZ=Europe/Berlin
    volumes:
      # Required: without these, Docker keeps config/ and logs/ in anonymous
      # volumes, and a recreated container starts with the template config
      # again. config/ holds batcontrol_config.yaml and the inverter backup
      # restored on shutdown.
      - './config:/app/config'
      - './logs:/app/logs'
    # Must match api.port in the config.
    ports:
      - "8080:8080"
    # Give batcontrol time to restore the inverter settings on shutdown.
    stop_grace_period: 30s
    restart: unless-stopped
